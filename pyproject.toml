[project]
name = "orbitkb"
version = "2.85.0"
description = "Task-aware change intelligence for AI coding agents, served via MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Manoel Medeiros" },
]
keywords = ["mcp", "ai-agents", "microservices", "change-intelligence", "architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]
dependencies = [
    "mcp>=2.0.0",
    "jsonschema>=4.21.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-typescript>=0.23.2",
    "python-hcl2>=6.0",
    "cfn-flip>=1.3",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "vulture>=2.11",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
]
# Local, CPU-only semantic retrieval fallback for find_change_surface (see
# generation/embeddings.py) — never required by the default install; a task whose
# vocabulary doesn't keyword-match anything indexed just returns fewer candidates
# without this extra, rather than erroring.
semantic = [
    "fastembed>=0.4",
]
tokens = [
    "tiktoken>=0.8",
]

[project.urls]
Homepage = "https://github.com/manorfm/orbitkb"
Repository = "https://github.com/manorfm/orbitkb"
Issues = "https://github.com/manorfm/orbitkb/issues"

[project.scripts]
orbitkb = "orbitkb.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbitkb*"]

[tool.setuptools.package-data]
orbitkb = ["db/schema.sql", "generation/prompts/*.md", "generation/schemas/*.json"]

[tool.coverage.run]
source = ["orbitkb"]
# get_relationships/find_change_surface are exercised via a subprocess MCP server
# (tests/test_mcp_*.py drive it over real stdio), so coverage must follow across the
# process boundary: parallel + the COVERAGE_PROCESS_START env var + a `coverage.pth`
# startup hook in the interpreter's site-packages (see CONTRIBUTING notes / README).
parallel = true
relative_files = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]

[tool.bandit]
exclude_dirs = ["tests", "verify", "benchmark", ".venv"]
# B404/B603/B607: subprocess is used deliberately (invoking claude/codex/git via
# PATH, never shell=True) to shell out to the LLM CLI backends and to git — that's
# the whole point of generation/*_backend.py and discovery/hashing.py, not a risk
# to flag on every run. Everything else stays active.
skips = ["B404", "B603", "B607"]
